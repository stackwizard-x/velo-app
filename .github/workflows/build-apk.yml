name: Build Velo APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use the same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Add native music-library plugin and permission
        run: |
          cp native/VeloMedia.java android/app/src/main/java/com/velo/player/VeloMedia.java
          cp native/MainActivity.java android/app/src/main/java/com/velo/player/MainActivity.java
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: velo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
